name: tests
on: [push, pull_request]
permissions:
  contents: read
env:
  PYTHONUTF8: '1'
jobs:
  core:
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        python: ['3.9', '3.11', '3.14', '3.15']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests -v
  legacy-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # setup-python has no Python 3.6 build for current Ubuntu runners.
      - run: docker run --rm -v "$GITHUB_WORKSPACE:/work" -w /work python:3.6.15-slim-buster python -m unittest discover -s tests -v
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install build twine
      - run: python -m build
      - run: python -m twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: distributions
          path: dist/*
          if-no-files-found: error
      - name: Test installed wheel outside source tree
        run: |
          python -m venv "$RUNNER_TEMP/wheel-test"
          "$RUNNER_TEMP/wheel-test/bin/python" -m pip install --no-deps dist/*.whl
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/wheel-test/bin/python" -m unittest discover -s "$GITHUB_WORKSPACE/tests" -v
          "$RUNNER_TEMP/wheel-test/bin/khmereasytools" --version
  installed:
    needs: package
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-14, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v4
        with:
          name: distributions
          path: dist/
      - name: Install Tesseract on Linux
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y tesseract-ocr
      - name: Install Tesseract on macOS
        if: runner.os == 'macOS'
        run: brew install tesseract
      - name: Install Tesseract on Windows
        if: runner.os == 'Windows'
        run: choco install tesseract --no-progress --yes
      - name: Prepare checksum-pinned Khmer language data
        run: python scripts/prepare_ocr_ci.py
      - name: Test fresh core and all-extras installations outside checkout
        run: python scripts/test_installed.py
      - name: Replay pinned POS corpus accuracy with a fresh core-only wheel
        run: python scripts/run_tagger_accuracy_ci.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: validation-${{ matrix.os }}
          path: validation-results/*.json
          if-no-files-found: warn
