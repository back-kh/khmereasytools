name: tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  core:
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        python: ['3.9', '3.11', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests -v
  legacy-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # setup-python has no Python 3.6 build for current Ubuntu runners.
      - run: docker run --rm -v "$GITHUB_WORKSPACE:/work" -w /work python:3.6.15-slim-buster python -m unittest discover -s tests -v
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install build twine
      - run: python -m build
      - run: python -m twine check dist/*
      - name: Test installed wheel outside source tree
        run: |
          python -m venv "$RUNNER_TEMP/wheel-test"
          "$RUNNER_TEMP/wheel-test/bin/python" -m pip install --no-deps dist/*.whl
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/wheel-test/bin/python" -m unittest discover -s "$GITHUB_WORKSPACE/tests" -v
          "$RUNNER_TEMP/wheel-test/bin/khmereasytools" --version
  khmer-ocr:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    env:
      KET_RUN_OCR_TESTS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: sudo apt-get update && sudo apt-get install -y tesseract-ocr tesseract-ocr-khm
      - run: python -m pip install '.[ocr]'
      - run: python -m unittest discover -s tests -v
