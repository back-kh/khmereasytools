name: mixed-ocr
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/ocr-mixed.yml'
      - 'scripts/evaluate_mixed_ocr.py'
      - 'scripts/run_mixed_ocr_ci.py'
      - 'scripts/evaluate_ocr_target.py'
      - 'scripts/evaluation_metrics.py'
      - 'scripts/fetch_accuracy_data.py'
      - 'benchmarks/accuracy/OCR_MIXED_*.md'
      - 'khmereasytools/ocr.py'
      - 'khmereasytools/documents.py'
permissions:
  contents: read
env:
  PYTHONUTF8: '1'
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install build
      - run: python -m build --wheel
      - uses: actions/upload-artifact@v4
        with:
          name: mixed-ocr-wheel
          path: dist/*.whl
          if-no-files-found: error
  evaluate:
    needs: package
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-14, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v4
        with:
          name: mixed-ocr-wheel
          path: dist/
      - name: Install Tesseract on Linux
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y tesseract-ocr
      - name: Install Tesseract on macOS
        if: runner.os == 'macOS'
        run: brew install tesseract
      - name: Install Tesseract on Windows
        if: runner.os == 'Windows'
        run: choco install tesseract --no-progress --yes
      - name: Locate engine and prepare pinned Khmer data
        run: python scripts/prepare_ocr_ci.py
      - name: Evaluate explicit mixed mode through the installed wheel
        run: python scripts/run_mixed_ocr_ci.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mixed-ocr-${{ matrix.os }}
          path: validation-results/mixed-ocr/*.json
          if-no-files-found: warn
