name: accuracy
on:
  workflow_dispatch:
  push:
    paths:
      - '.gitattributes'
      - '.github/workflows/accuracy.yml'
      - 'scripts/compare_improvements.py'
      - 'scripts/evaluate_ocr_target.py'
      - 'scripts/prepare_ocr_ci.py'
      - 'scripts/run_accuracy_ci.py'
      - 'scripts/evaluation_metrics.py'
      - 'scripts/fetch_accuracy_data.py'
      - 'benchmarks/accuracy/IMPROVEMENT_PROTOCOL.md'
      - 'benchmarks/accuracy/OCR_TARGET_PROTOCOL.md'
      - 'khmereasytools/segmentation.py'
      - 'khmereasytools/pos.py'
      - 'khmereasytools/ocr.py'
      - 'khmereasytools/data/frequency_manifest.json'
permissions:
  contents: read
env:
  PYTHONUTF8: '1'
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install build
      - run: python -m build --wheel
      - uses: actions/upload-artifact@v4
        with:
          name: accuracy-wheel
          path: dist/*.whl
          if-no-files-found: error
  compare:
    needs: package
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-14, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v4
        with:
          name: accuracy-wheel
          path: dist/
      - name: Install Tesseract on Linux
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y tesseract-ocr
      - name: Install Tesseract on macOS
        if: runner.os == 'macOS'
        run: brew install tesseract
      - name: Install Tesseract on Windows
        if: runner.os == 'Windows'
        run: choco install tesseract --no-progress --yes
      - name: Prepare pinned Khmer model
        run: python scripts/prepare_ocr_ci.py
      - name: Prepare separate pinned optional model
        run: python scripts/prepare_ocr_ci.py --best
      - name: Compare real-document and annotated-text accuracy
        run: python scripts/run_accuracy_ci.py --ocr-target
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: accuracy-${{ matrix.os }}
          path: validation-results/accuracy/*.json
          if-no-files-found: warn
